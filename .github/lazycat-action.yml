version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/erugo.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: erugo
build:
  run_buildscript: false
images:
  - id: erugo
    target: service
    service: erugo
    source: wardy784/erugo
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: erugo
    summary: "一个WeTransfer的替代方案"
